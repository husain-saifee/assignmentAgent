[project]
name = "assignment-evaluation-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "google-genai>=2.29.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.0",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "reportlab>=5.0.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

